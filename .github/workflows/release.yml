name: 构建与发布 (Build and Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如: v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    name: 编译 Windows 应用
    runs-on: windows-latest

    steps:
    - name: 检出代码 (Checkout)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 配置 MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: 还原依赖 (Restore)
      run: msbuild Services.sln /t:Restore /p:Configuration=Release

    - name: 编译并发布单文件版 (Build & Publish Single File)
      run: |
        msbuild ServicesApp/ServicesApp.csproj `
          /t:Publish `
          /p:Configuration=Release `
          /p:RuntimeIdentifier=win-x64 `
          /p:PublishSingleFile=true `
          /p:SelfContained=true `
          /p:PublishDir=${{ github.workspace }}\publish-single\ `
          /p:DebugType=none

    - name: 编译并发布文件夹版 (Build & Publish Folder)
      run: |
        msbuild ServicesApp/ServicesApp.csproj `
          /t:Publish `
          /p:Configuration=Release `
          /p:RuntimeIdentifier=win-x64 `
          /p:PublishSingleFile=false `
          /p:SelfContained=true `
          /p:PublishDir=${{ github.workspace }}\publish-folder\ `
          /p:DebugType=none

    - name: 打包单文件版 (Zip Single File)
      working-directory: publish-single
      run: |
        Compress-Archive -Path * -DestinationPath ../ServicesApp-win-x64.zip

    - name: 打包文件夹版 (Zip Folder)
      run: |
        New-Item -ItemType Directory -Force -Path ServicesApp-win-x64-folder | Out-Null
        Copy-Item -Path publish-folder\* -Destination ServicesApp-win-x64-folder -Recurse -Force
        Compress-Archive -Path ServicesApp-win-x64-folder -DestinationPath ServicesApp-win-x64-folder.zip

    - name: 生成提交日志 (Generate Changelog)
      id: changelog
      run: |
        $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
        if ($prevTag) {
          $commits = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)" --no-merges
        } else {
          $commits = git log --pretty=format:"- %s (%h)" --no-merges
        }
        $changelog = $commits -join "`n"
        if ([string]::IsNullOrWhiteSpace($changelog)) {
          $changelog = "- 初始版本发布"
        }
        echo "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
        echo $changelog >> $env:GITHUB_OUTPUT
        echo "EOF" >> $env:GITHUB_OUTPUT
    
    - name: 获取发布标签 (Get Release Tag)
      id: tag
      run: |
        $tagName = "${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
        echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT

    - name: 创建 GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ServicesApp-win-x64.zip
          ServicesApp-win-x64-folder.zip
        body: |
          ## 更新内容
          
          ${{ steps.changelog.outputs.CHANGELOG }}
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: Release ${{ steps.tag.outputs.TAG_NAME }}
        draft: false
        prerelease: false
